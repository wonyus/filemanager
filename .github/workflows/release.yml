name: Protected Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version (for example 1.2.3)
        required: true
        type: string
      channel:
        description: Signed update channel
        required: true
        default: stable
        type: choice
        options: [stable, beta]
      notes:
        description: Release notes shown before installation
        required: false
        default: Security and reliability fixes
        type: string

permissions:
  contents: write

# Signing material remains protected in the GitHub environment. Update URLs
# are derived from the GitHub Release endpoints for the selected channel.
jobs:
  windows-release:
    runs-on: windows-latest
    environment: protected-release
    env:
      S3FM_RELEASE_VERSION: ${{ inputs.version }}
      S3FM_RELEASE_CHANNEL: ${{ inputs.channel }}
      S3FM_RELEASE_NOTES: ${{ inputs.notes }}
      S3FM_RELEASE_PUB_DATE: ${{ github.event.repository.updated_at }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_SIGNING_CERTIFICATE_PATH: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PATH }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Configure GitHub Release update URLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = $env:GITHUB_REPOSITORY
          $stableManifest = "https://github.com/$repository/releases/latest/download/stable-latest.json"
          $betaManifest = "https://github.com/$repository/releases/download/beta-latest/beta-latest.json"
          if ($env:S3FM_RELEASE_CHANNEL -eq 'stable') {
            $artifactBase = "https://github.com/$repository/releases/latest/download/"
          } else {
            $artifactBase = "https://github.com/$repository/releases/download/beta-latest/"
          }
          @(
            "S3FM_UPDATE_MANIFEST_URL_STABLE=$stableManifest"
            "S3FM_UPDATE_MANIFEST_URL_BETA=$betaManifest"
            "S3FM_UPDATE_ARTIFACT_BASE_URL=$artifactBase"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import base64 Authenticode certificate when supplied
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 's3fm-certificate'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $encoded = Join-Path $directory 'certificate.txt'
          $pfx = Join-Path $directory 'certificate.pfx'
          [IO.File]::WriteAllText($encoded, $env:WINDOWS_CERTIFICATE)
          certutil -decode $encoded $pfx | Out-Null
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          Remove-Item -LiteralPath $encoded, $pfx -Force
      - name: Import protected Authenticode certificate when supplied
        if: ${{ env.WINDOWS_SIGNING_CERTIFICATE_PATH != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $env:WINDOWS_SIGNING_CERTIFICATE_PATH -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
      - name: Validate protected release inputs
        # The archive signature is produced by the build, so the manifest
        # phase is validated after the updater artifact exists.
        run: node scripts/validate-release-config.mjs --strict --config-only
      - name: Generate release Tauri overlay
        run: pnpm release:tauri-config
      - name: Build signed MSVC NSIS and updater artifacts
        run: pnpm tauri build --bundles nsis --features updater --config dist/tauri.release.conf.json
      - name: Derive updater URL and generate signed manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Filter '*.zip' | Where-Object { $_.Name -notlike '*.sig' } | Select-Object -First 1
          if (-not $zip) { throw 'Tauri updater archive was not generated' }
          $sigPath = "$($zip.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigPath)) { throw "Updater signature was not generated: $sigPath" }
          $signature = (Get-Content -LiteralPath $sigPath -Raw).Trim()
          if (-not $signature) { throw 'Updater signature is empty' }
          $baseValue = $env:S3FM_UPDATE_ARTIFACT_BASE_URL.Trim()
          if (-not $baseValue -or $baseValue -match 'example\.invalid|localhost|127\.0\.0\.1') { throw 'S3FM_UPDATE_ARTIFACT_BASE_URL is not configured' }
          try { $baseUrl = [Uri]$baseValue } catch { throw 'S3FM_UPDATE_ARTIFACT_BASE_URL must be an absolute HTTPS URL' }
          if (-not $baseUrl.IsAbsoluteUri -or $baseUrl.Scheme -ne 'https' -or $baseUrl.UserInfo -or $baseUrl.Query -or $baseUrl.Fragment) { throw 'S3FM_UPDATE_ARTIFACT_BASE_URL must be an absolute HTTPS URL without credentials, query, or fragment' }
          $base = $baseUrl.AbsoluteUri.TrimEnd('/')
          $encodedName = [Uri]::EscapeDataString($zip.Name)
          "S3FM_UPDATE_ARTIFACT_URL_WINDOWS_X86_64=$base/$encodedName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_UPDATER_SIGNATURE_WINDOWS_X86_64=$signature" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "S3FM_RELEASE_PUB_DATE=$([DateTime]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate signed update manifest
        run: pnpm release:manifest
      - name: Verify NSIS installer
        run: pnpm verify:installer -- --required
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = $env:S3FM_RELEASE_CHANNEL
          $version = $env:S3FM_RELEASE_VERSION
          $manifest = Join-Path $env:GITHUB_WORKSPACE "dist/updater/$channel-latest.json"
          if (-not (Test-Path -LiteralPath $manifest)) { throw "Update manifest was not generated: $manifest" }

          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          $archive = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File -Filter '*.zip' | Where-Object { $_.Name -notlike '*.sig' } | Select-Object -First 1
          if (-not $archive) { throw 'Updater archive was not generated' }
          $signature = Get-Item "$($archive.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signature) { throw "Updater signature was not generated: $($archive.FullName).sig" }

          $assetPaths = @($installer.FullName, $archive.FullName, $signature.FullName, $manifest)
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE 'dist/updater/checksums.txt'
          $checksumLines = foreach ($assetPath in $assetPaths) {
            $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$([IO.Path]::GetFileName($assetPath))"
          }
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding ascii
          $assetPaths += $checksumPath

          $tag = if ($channel -eq 'stable') { "v$version" } else { 'beta-latest' }
          $title = if ($channel -eq 'stable') { "S3 File Manager v$version" } else { "S3 File Manager $version Beta" }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = $env:S3FM_RELEASE_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "S3 File Manager $version" }
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($channel -eq 'beta' -and $releaseExists) {
            & gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber $assetPaths
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload beta release assets' }
            & gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesPath --prerelease --draft=false
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update beta release metadata' }
          } elseif (-not $releaseExists) {
            $releaseArgs = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', $title, '--notes-file', $notesPath)
            if ($channel -eq 'beta') { $releaseArgs += '--prerelease' }
            $releaseArgs += $assetPaths
            & gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw 'Failed to publish GitHub Release' }
          } else {
            throw "Release tag already exists: $tag"
          }
      - name: Upload release artifacts for deployment
        uses: actions/upload-artifact@v4
        with:
          name: s3-file-manager-${{ inputs.channel }}-${{ inputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            dist/updater/*.json
            dist/updater/checksums.txt
