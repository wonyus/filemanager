name: Unsigned Windows preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview semver (for example 0.1.1-preview.1)
        required: true
        default: 0.1.1-preview.1
        type: string
      notes:
        description: Release notes shown before installation
        required: false
        default: Development preview build; Windows may show a SmartScreen warning.
        type: string

permissions:
  contents: write

jobs:
  windows-preview:
    runs-on: windows-latest
    env:
      PREVIEW_VERSION: ${{ inputs.version }}
      PREVIEW_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Generate preview Tauri overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PREVIEW_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "PREVIEW_VERSION must be valid semver: $env:PREVIEW_VERSION"
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.preview.conf.json'
          @{ version = $env:PREVIEW_VERSION } | ConvertTo-Json | Set-Content -LiteralPath $configPath -Encoding utf8
          "PREVIEW_CONFIG_PATH=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build unsigned NSIS installer
        shell: pwsh
        run: pnpm tauri build --bundles nsis --no-sign --config $env:PREVIEW_CONFIG_PATH
      - name: Verify preview installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          $env:S3FM_INSTALLER_PATH = $installer.FullName
          pnpm verify:installer -- --required
          if ($LASTEXITCODE -ne 0) { throw 'Preview installer verification failed' }
      - name: Publish GitHub preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE 'dist/preview/checksums.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $checksumPath) | Out-Null
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          $notesPath = Join-Path $env:RUNNER_TEMP 'preview-release-notes.md'
          $notes = $env:PREVIEW_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "S3 File Manager $($env:PREVIEW_VERSION) preview" }
          @(
            "## S3 File Manager $($env:PREVIEW_VERSION)"
            ''
            $notes
            ''
            'This is an unsigned Windows preview. Windows SmartScreen may display a warning because no Authenticode certificate is attached.'
            'The signed updater is not included in this preview build.'
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8

          $tag = "v$($env:PREVIEW_VERSION)"
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release tag already exists: $tag" }
          & gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "S3 File Manager $($env:PREVIEW_VERSION)" --notes-file $notesPath --prerelease $installer.FullName $checksumPath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish preview GitHub Release' }
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s3-file-manager-preview-${{ inputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/preview/checksums.txt
